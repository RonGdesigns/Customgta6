# Temporary branch-only verification and publisher; self-removes after success.
name: atmosphere-pass-build
on:
  push:
    branches: [codex/private-visuals-foundation]
    paths: [tools/visuals/apply_atmosphere_pass.py, .github/workflows/atmosphere-pass-build.yml, src/Bloodlines/Core/TimecycleGrade.cs, tests/story/AtmosphereTransitionTests.cs]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: atmosphere-pass-build
  cancel-in-progress: true
jobs:
  verify-and-publish:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/private-visuals-foundation'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore exact committed inputs and apply the bounded edits
        shell: python
        run: |
          import io,pathlib,subprocess,zipfile
          subprocess.run(['git','config','core.autocrlf','false'],check=True)
          # Restore ALL tracked bytes, not just src: changing autocrlf after a
          # Windows checkout otherwise makes untouched LF data look modified.
          raw=subprocess.check_output(['git','archive','--format=zip','HEAD'])
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  name=pathlib.PurePosixPath(item.filename)
                  if name.is_absolute() or '..' in name.parts: raise SystemExit('Unsafe tracked path')
                  target=pathlib.Path(*name.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          subprocess.run(['git','diff','--exit-code'],check=True)
          subprocess.run(['python','tools/visuals/apply_atmosphere_pass.py'],check=True)
      - name: Compile and run all suites with retained diagnostics
        shell: python
        run: |
          import pathlib,re,subprocess,sys
          p=pathlib.Path
          commands=[
              ('production',['dotnet','build','src/Bloodlines/Bloodlines.csproj','-c','Release','--warnaserror']),
              ('story',['python','tools/run_story_tests.py']),
              ('regression',['python','tools/run_regression_tests.py']),
              ('visual-tools',['python','-m','unittest','discover','-s','tools/visuals','-p','test_*.py','-v']),
              ('parser',['python','tools/test_dialogue_parser.py']),
              ('lint',['python','tools/lint_missions.py']),
              ('locations',['python','tools/validate_locations.py']),
              ('scene-freshness',['python','tools/build_story.py','--check']),
              ('map-freshness',['python','tools/audit_campaign.py','--check']),
              ('campaign-render',['python','tools/render_campaign_doc.py']),
              ('feasibility-render',['python','tools/render_feasibility_doc.py']),
              ('data-preservation',['git','diff','--exit-code','--','data','docs/CAMPAIGN.md','docs/FEASIBILITY.md']),
              ('roslyn',['python','tools/build_roslyn.py'])]
          for name,command in commands:
              log=p('build')/(name+'-atmosphere.log')
              with log.open('w',encoding='utf-8') as out:
                  out.write('COMMAND: '+repr(command)+'\n');out.flush()
                  result=subprocess.run(command,stdout=out,stderr=subprocess.STDOUT)
              print(name,'exit',result.returncode)
              print('\n'.join(log.read_text(encoding='utf-8',errors='replace').splitlines()[-12:]))
              if result.returncode:sys.exit(result.returncode)
          text=p('build/locations-atmosphere.log').read_text(encoding='utf-8')
          if not re.search(r'\b0 of \d+ flagged\b|\b0 flagged\b',text):raise SystemExit('Coordinate check did not report zero findings')
      - name: Verify preservation and matching package before publication
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path
          changes=json.loads(p('build/atmosphere-changes.json').read_text())
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not actual.issubset(set(changes)):raise SystemExit('Unexpected tracked edits: '+str(actual-set(changes)))
          subprocess.run(['git','diff','--exit-code','--','src/Bloodlines/Missions','data','src/Bloodlines/Core/PrologueSequence.cs','src/Bloodlines/Core/ApartmentTiers.cs','src/Bloodlines/Abilities','config'],check=True)
          raw=p('src/Bloodlines/bin/Release/Bloodlines.dll').read_bytes()
          p('prebuilt/Bloodlines.dll').write_bytes(raw)
          report=p('docs/VISUAL-ATMOSPHERE-VERIFICATION.md')
          report.write_text('# Atmosphere pass verification\n\nSource verification and matching package only; no GTA playthrough was available.\n\n'
              +'## Story\n```text\n'+'\n'.join(p('build/story-atmosphere.log').read_text(encoding='utf-8',errors='replace').splitlines()[-4:])+'\n```\n'
              +'## Regression\n```text\n'+'\n'.join(p('build/regression-atmosphere.log').read_text(encoding='utf-8',errors='replace').splitlines()[-2:])+'\n```\n'
              +'\nProduction warnings-as-errors build, visual-tool fixtures, parser, mission lint, zero-finding coordinate audit, freshness checks and Roslyn rebuild passed.\n'
              +'\nMission sources, runtime data, configuration, abilities, home/prologue files and placements are byte-for-byte unchanged from the reviewed input. Host/menu wiring and visual controller are the only existing runtime files edited.\n'
              +'\nDLL SHA-256: `'+hashlib.sha256(raw).hexdigest()+'`.\n',encoding='utf-8')
          subprocess.run(['python','tools/package.py','--clean'],check=True)
          assert raw==p('prebuilt/Bloodlines.dll').read_bytes()==p('build/deploy/scripts/Bloodlines.dll').read_bytes()
          deploy=p('build/deploy')
          assert not list(deploy.rglob('savegame.json')) and not list(deploy.rglob('Bloodlines.Surveyed.ini'))
          assert not (deploy/'scripts/Bloodlines/Bloodlines.ini').exists()
      - name: Publish only to the comparison branch and assemble artifacts
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import hashlib,json,os,pathlib,shutil,subprocess
          p=pathlib.Path;branch='codex/private-visuals-foundation'
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          if remote!=os.environ['EXPECTED_HEAD']:raise SystemExit('Branch advanced; refusing to overwrite newer work')
          changes=json.loads(p('build/atmosphere-changes.json').read_text())
          temporary=['tools/visuals/apply_atmosphere_pass.py','.github/workflows/atmosphere-pass-build.yml']
          for name in temporary:p(name).unlink()
          changes+=temporary+['prebuilt/Bloodlines.dll','docs/VISUAL-ATMOSPHERE-VERIFICATION.md']
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+changes,check=True)
          subprocess.run(['git','-c','core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','feat: publish verified atmosphere ownership, fades and grade-only comparison'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          raw=p('prebuilt/Bloodlines.dll').read_bytes();deploy=p('build/deploy')
          provenance={'commit':sha,'branch':branch,'base':'6867c858d45e0a7d11369d33ac117f3f044a9b8a','actions_run':os.environ['GITHUB_RUN_ID'],'dll_sha256':hashlib.sha256(raw).hexdigest(),'live_verified':False,'forest_assets_included':False}
          (deploy/'BUILD-PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n',encoding='utf-8')
          for name in ['VISUAL-ATMOSPHERE-PASS.md','VISUAL-ATMOSPHERE-VERIFICATION.md']:shutil.copy2(p('docs')/name,deploy/name)
          (deploy/'READ-ME-FIRST.txt').write_text('Bloodlines atmosphere comparison - NOT live verified.\nFinish the same-DLL Forests baseline BEFORE installing this new comparison. Back up the old DLL and full Bloodlines folder outside scripts, close GTA, then copy only the packaged scripts contents. Keep runtime dependencies, audio, real INI, appearance and surveyed files. Use a copied campaign in Story Mode only. Do not import _openiv_import or install a second Bloodlines DLL.\nWorld > Grading comparison in the existing developer menu changes only our grade; it does not uninstall Forests, change weather/time/water or disable other visual options. Read VISUAL-ATMOSPHERE-PASS.md for one-second fades and limits.\nCommit: '+sha+'\n',encoding='utf-8')
          shutil.make_archive('build/Bloodlines-Atmosphere-Comparison-Preview','zip',deploy)
          subprocess.run(['git','archive','-o','build/Bloodlines-Atmosphere-Comparison-Source.zip','HEAD'],check=True)
          print(json.dumps(provenance,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: Bloodlines-atmosphere-comparison
          retention-days: 14
          path: |
            build/Bloodlines-Atmosphere-Comparison-Preview.zip
            build/Bloodlines-Atmosphere-Comparison-Source.zip
            build/deploy/BUILD-PROVENANCE.json
            build/*atmosphere.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atmosphere-failure-logs
          retention-days: 7
          path: build/*atmosphere.log
