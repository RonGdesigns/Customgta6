name: harbor-repair-preview
on:
  push:
    branches: [codex/harbor-playtest-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harbor-repair-preview
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/harbor-playtest-repair'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Capture exact source for comparison
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          git archive -o build/Harbor-Repair-Source.zip HEAD
      - name: Build and verify
        shell: pwsh
        run: |
          dotnet build src/Bloodlines/Bloodlines.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_story_tests.py *> build/story-harbor.log
          $result=$LASTEXITCODE
          Get-Content build/story-harbor.log -Tail 12
          if ($result -ne 0) { exit $result }
          python tools/run_regression_tests.py *> build/regression-harbor.log
          $result=$LASTEXITCODE
          Get-Content build/regression-harbor.log -Tail 5
          if ($result -ne 0) { exit $result }
          python tools/test_dialogue_parser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/lint_missions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_locations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_story.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_campaign.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-repair-source-and-checks
          retention-days: 14
          path: |
            build/Harbor-Repair-Source.zip
            build/*harbor.log
            src/Bloodlines/bin/Release/Bloodlines.dll
