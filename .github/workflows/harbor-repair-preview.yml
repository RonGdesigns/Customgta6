# Read-only comparison artifacts; no commits, merges, or game-install writes.
name: harbor-repair-preview
on:
  push:
    branches: [codex/harbor-playtest-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harbor-repair-preview
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/harbor-playtest-repair'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore exact committed compiler inputs
        shell: python
        run: |
          import pathlib,subprocess
          subprocess.run(['git','config','core.autocrlf','false'],check=True)
          for name in filter(None,subprocess.check_output(['git','ls-files','-z','--','src']).decode().split('\0')):
              pathlib.Path(name).write_bytes(subprocess.check_output(['git','show','HEAD:'+name]))
          pathlib.Path('build').mkdir(exist_ok=True)
      - name: Build and verify
        shell: pwsh
        run: |
          dotnet build src/Bloodlines/Bloodlines.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_story_tests.py *> build/story-harbor.log
          $result=$LASTEXITCODE
          Get-Content build/story-harbor.log -Tail 8
          if ($result -ne 0) { exit $result }
          python tools/run_regression_tests.py *> build/regression-harbor.log
          $result=$LASTEXITCODE
          Get-Content build/regression-harbor.log -Tail 3
          if ($result -ne 0) { exit $result }
          python tools/test_dialogue_parser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/lint_missions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_locations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_story.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_campaign.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_roslyn.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package.py --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged bytes, preservation evidence and exact version
        shell: python
        run: |
          import hashlib,json,os,pathlib,shutil,subprocess
          p=pathlib.Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          built=p('src/Bloodlines/bin/Release/Bloodlines.dll').read_bytes()
          assert built==p('prebuilt/Bloodlines.dll').read_bytes(), 'Fresh and committed DLLs differ'
          assert built==p('build/deploy/scripts/Bloodlines.dll').read_bytes(), 'Fresh and packaged DLLs differ'
          digest=hashlib.sha256(built).hexdigest()
          manifest=json.loads(p('docs/HARBOR-INTEGRATION-PRESERVATION.json').read_text(encoding='utf-8'))
          assert manifest['integrated_main']=='f8a37b9837b11f6661df081fd59616b7c06e6bb3'
          assert manifest['combined_dll_sha256']==digest, 'Binary no longer matches reviewed integration'
          for side in ('main_exclusive','repair_exclusive'):
              for name,entry in manifest[side].items():
                  if name.startswith(('src/','tests/','data/','config/')):
                      raw=subprocess.check_output(['git','show','HEAD:'+name])
                      assert hashlib.sha256(raw).hexdigest()==entry['sha256'], 'Preserved source changed: '+name
          for name,expected in manifest['shared_reviewed'].items():
              if name.startswith(('src/','tests/','data/')):
                  assert hashlib.sha256(subprocess.check_output(['git','show','HEAD:'+name])).hexdigest()==expected, 'Shared resolution changed: '+name
          deploy=p('build/deploy')
          assert not list(deploy.rglob('savegame.json')), 'Do not package a campaign save'
          assert not list(deploy.rglob('Bloodlines.Surveyed.ini')), 'Do not package personal surveys'
          assert not (deploy/'scripts/Bloodlines/Bloodlines.ini').exists(), 'Configuration must remain an example'
          extra=deploy/'_openiv_import'
          if extra.exists():shutil.rmtree(extra)
          provenance={'commit':sha,'branch':'codex/harbor-playtest-repair','base':'d295306764fa137ceda3e1f3741e2a0d766bdb45','integrated_main':manifest['integrated_main'],'integration_commit':'75274fd2f8e209cca1a86b6b7f871bd3c64b58d4','dll_sha256':digest,'actions_run':os.environ['GITHUB_RUN_ID'],'live_verified':False,'heist_retry':'whole operation from M19; no checkpoints'}
          (deploy/'BUILD-PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n',encoding='utf-8')
          (deploy/'READ-ME-FIRST.txt').write_text('Bloodlines integrated harbor playtest repair - comparison build, not a live-verified release.\n\nCommit: '+sha+'\nDLL SHA-256: '+digest+'\n\nIncludes main f8a37b9 through PR #32 AND the harbor repair. The latest M03-M08 changes, desert missions and apartment tiers are retained. The original agents\' exclusive source was preserved and one combined DLL rebuilt; do not install two alternative DLLs together. Main itself has not been updated by this comparison. Read HARBOR-INTEGRATION.md and the two preservation/binary manifests.\n\nThis supersedes the old isolated and phase-resume previews. Normal Port Heist attempts always start M19; failure, abort or quit restarts the whole operation. No midpoint checkpoints. Developer bypass remains an isolated phase diagnostic, not a combined-heist test.\n\nSTORY MODE ONLY. Close GTA before replacing files. Back up scripts/Bloodlines.dll and the entire scripts/Bloodlines directory OUTSIDE the scripts tree. Copy this package\'s scripts contents into a test installation. Use a disposable copied campaign; preserve your active INI, appearance, surveys, runtime dependencies and voice bank. Configuration ships as .example, not an overwrite. Do not put the source ZIP or a backup DLL into scripts.\n\nTest the preserved M03-M08 repairs, then M17/M18 dry fittings and the actual launch. Start M19 normally with prerequisites and required solos complete. If water preflight refuses, capture the exact key and original/resolved coordinates from Bloodlines.log; do not disable validation or guess another coordinate. M19.Worksite is the group anchor; derived work/cargo markers are recalculated together.\n\nOn-foot music uses installed-game events and still needs an audible check. Disable it with [Audio] MissionScoreEnabled=False. Letter sprites affect the radar/map, not ground activation cylinders. Existing apartments are retained, not newly certified as unique layouts.\n\nHARBOR-INTEGRATION-REVIEW.md records two inherited follow-ups in the M07 roof fallback and M08 mixed-role assignment; the preservation merge does not silently rewrite them. Source/stub checks do not establish actual water geometry, police sighting, animations, score audibility, road navigation or apartment rendering. No game installation or main-branch merge was performed.\n',encoding='utf-8')
          for name in ['HARBOR-PLAYTEST-REPAIR.md','HARBOR-REPAIR-VERIFICATION.md','CONTINUOUS-PORT-HEIST.md','HARBOR-INTEGRATION.md','HARBOR-INTEGRATION-PRESERVATION.json','HARBOR-INTEGRATION-BINARIES.json','HARBOR-INTEGRATION-REVIEW.md']:
              shutil.copy2(p('docs')/name,deploy/name)
          shutil.make_archive('build/Bloodlines-Harbor-Playtest-Preview','zip',deploy)
          subprocess.run(['git','archive','-o','build/Bloodlines-Harbor-Playtest-Source.zip','HEAD'],check=True)
          print(json.dumps(provenance,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: Bloodlines-harbor-playtest-preview
          retention-days: 14
          if-no-files-found: error
          path: |
            build/Bloodlines-Harbor-Playtest-Preview.zip
            build/Bloodlines-Harbor-Playtest-Source.zip
            build/deploy/BUILD-PROVENANCE.json
            build/*harbor.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harbor-repair-failure-evidence
          retention-days: 7
          path: |
            build/*harbor.log
            src/Bloodlines/bin/Release/Bloodlines.dll
