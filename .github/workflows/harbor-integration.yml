# Temporary integration runner. Publishes only a tested merge onto the repair branch,
# never main, and self-removes. No force-push, game-install or personal-save changes.
name: harbor-integration
on:
  push:
    branches: [codex/harbor-playtest-repair]
    paths: ['.github/workflows/harbor-integration.yml', 'tools/ci/integrate_harbor.py']
permissions:
  contents: read
concurrency:
  group: harbor-integration
  cancel-in-progress: true
jobs:
  integrate-and-verify:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/harbor-playtest-repair'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preserve exact input binaries and source snapshots for independent review
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          p=Path('build/binary-comparison');p.mkdir(parents=True,exist_ok=True)
          refs={'main-f8a37b9':'f8a37b9837b11f6661df081fd59616b7c06e6bb3','repair-ea4c546':'ea4c54667d60d10f8973bfeccdd9713c97499501'}
          info={}
          for label,ref in refs.items():
              raw=subprocess.check_output(['git','show',ref+':prebuilt/Bloodlines.dll'])
              (p/(label+'.dll')).write_bytes(raw)
              info[label]={'commit':ref,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              subprocess.run(['git','archive','--format=zip','-o','build/'+label+'-sources.zip',ref,'--','src','tests','tools','data','.gitattributes','CLAUDE.md'],check=True)
          (p/'inputs.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(info,indent=2))
      - name: Merge pinned main and verify both agents' preserved source
        run: python tools/ci/integrate_harbor.py prepare
      - name: Production compilation
        run: dotnet build src/Bloodlines/Bloodlines.csproj -c Release --warnaserror
      - name: All behavioral and data checks on combined source
        shell: pwsh
        run: |
          python tools/run_story_tests.py *> build/story-integration.log
          $result=$LASTEXITCODE
          Get-Content build/story-integration.log -Tail 20
          if ($result -ne 0) { exit $result }
          python tools/run_regression_tests.py *> build/regression-integration.log
          $result=$LASTEXITCODE
          Get-Content build/regression-integration.log -Tail 4
          if ($result -ne 0) { exit $result }
          python tools/test_dialogue_parser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/lint_missions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_locations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_story.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_campaign.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_campaign_doc.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_feasibility_doc.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated document content and retain its exact committed newline convention
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          for name in ('docs/CAMPAIGN.md','docs/FEASIBILITY.md'):
              expected=subprocess.check_output(['git','show','HEAD:'+name])
              generated=Path(name).read_bytes()
              assert generated.replace(b'\r\n',b'\n')==expected.replace(b'\r\n',b'\n'), 'Generated document content is stale: '+name
              Path(name).write_bytes(expected)
              print('Full regenerated content verified:',name)
          subprocess.run(['git','diff','--exit-code','--','docs/CAMPAIGN.md','docs/FEASIBILITY.md'],check=True)
      - name: Rebuild the combined DLL and clean package
        shell: pwsh
        run: |
          python tools/build_roslyn.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item src/Bloodlines/bin/Release/Bloodlines.dll prebuilt/Bloodlines.dll -Force
          python tools/package.py --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create static metadata and IL inspector outside the repository source
        shell: python
        run: |
          from pathlib import Path
          p=Path('build/dll-inspector');p.mkdir(exist_ok=True)
          (p/'Inspector.csproj').write_text('<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><Nullable>enable</Nullable></PropertyGroup></Project>',encoding='utf-8')
          (p/'Program.cs').write_text(r'''
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Reflection.Emit;
          using System.Reflection.Metadata;
          using System.Reflection.Metadata.Ecma335;
          using System.Reflection.PortableExecutable;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.Json;
          static class Program
          {
            static readonly Dictionary<ushort,OpCode> Ops=typeof(OpCodes).GetFields().Where(f=>f.FieldType==typeof(OpCode)).Select(f=>(OpCode)f.GetValue(null)!).GroupBy(o=>unchecked((ushort)o.Value)).ToDictionary(g=>g.Key,g=>g.First());
            static string Hash(byte[] b)=>Convert.ToHexString(SHA256.HashData(b)).ToLowerInvariant();
            static string Sig(MethodSignature<string> s)=>s.Header.RawValue+":"+s.GenericParameterCount+":"+s.ReturnType+"("+string.Join(",",s.ParameterTypes)+")";
            static string TypeName(MetadataReader r,TypeDefinitionHandle h)
            {
              var t=r.GetTypeDefinition(h);return t.GetDeclaringType().IsNil?(r.GetString(t.Namespace)+"."+r.GetString(t.Name)).TrimStart('.'):TypeName(r,t.GetDeclaringType())+"+"+r.GetString(t.Name);
            }
            static string Token(MetadataReader r,EntityHandle h)
            {
              if(h.IsNil)return "nil";var p=new Names();
              switch(h.Kind)
              {
                case HandleKind.TypeDefinition:return TypeName(r,(TypeDefinitionHandle)h);
                case HandleKind.TypeReference:
                  var t=r.GetTypeReference((TypeReferenceHandle)h);
                  return t.ResolutionScope.Kind==HandleKind.TypeReference?Token(r,(EntityHandle)t.ResolutionScope)+"+"+r.GetString(t.Name):(r.GetString(t.Namespace)+"."+r.GetString(t.Name)).TrimStart('.');
                case HandleKind.TypeSpecification:return r.GetTypeSpecification((TypeSpecificationHandle)h).DecodeSignature(p,(object?)null);
                case HandleKind.MethodDefinition:
                  var m=r.GetMethodDefinition((MethodDefinitionHandle)h);return TypeName(r,m.GetDeclaringType())+"::"+r.GetString(m.Name)+Sig(m.DecodeSignature(p,(object?)null));
                case HandleKind.FieldDefinition:
                  var f=r.GetFieldDefinition((FieldDefinitionHandle)h);return TypeName(r,f.GetDeclaringType())+"::"+r.GetString(f.Name)+":"+f.DecodeSignature(p,(object?)null);
                case HandleKind.MemberReference:
                  var mr=r.GetMemberReference((MemberReferenceHandle)h);return Token(r,mr.Parent)+"::"+r.GetString(mr.Name)+(mr.GetKind()==MemberReferenceKind.Field?":"+mr.DecodeFieldSignature(p,(object?)null):Sig(mr.DecodeMethodSignature(p,(object?)null)));
                case HandleKind.MethodSpecification:
                  var ms=r.GetMethodSpecification((MethodSpecificationHandle)h);return Token(r,ms.Method)+"<"+string.Join(",",ms.DecodeSignature(p,(object?)null))+">";
                case HandleKind.StandaloneSignature:return Sig(r.GetStandaloneSignature((StandaloneSignatureHandle)h).DecodeMethodSignature(p,(object?)null));
                default:return h.Kind+":"+MetadataTokens.GetToken(h).ToString("X8");
              }
            }
            static string NormalizedBody(MetadataReader r,MethodBodyBlock b)
            {
              var il=b.GetILBytes()??Array.Empty<byte>();var lines=new List<string>();using var br=new BinaryReader(new MemoryStream(il));
              while(br.BaseStream.Position<il.Length)
              {
                int offset=(int)br.BaseStream.Position;ushort op=br.ReadByte();if(op==0xfe)op=(ushort)(0xfe00|br.ReadByte());
                if(!Ops.TryGetValue(op,out var code))throw new InvalidDataException("Unknown opcode "+op);string value="";
                switch(code.OperandType)
                {
                  case OperandType.InlineNone:break;
                  case OperandType.ShortInlineBrTarget:case OperandType.ShortInlineI:value=br.ReadSByte().ToString();break;
                  case OperandType.InlineBrTarget:case OperandType.InlineI:value=br.ReadInt32().ToString();break;
                  case OperandType.InlineI8:value=br.ReadInt64().ToString();break;
                  case OperandType.ShortInlineVar:value=br.ReadByte().ToString();break;
                  case OperandType.InlineVar:value=br.ReadUInt16().ToString();break;
                  case OperandType.ShortInlineR:value=Convert.ToHexString(br.ReadBytes(4));break;
                  case OperandType.InlineR:value=Convert.ToHexString(br.ReadBytes(8));break;
                  case OperandType.InlineString:value=JsonSerializer.Serialize(r.GetUserString(MetadataTokens.UserStringHandle(br.ReadInt32()&0x00ffffff)));break;
                  case OperandType.InlineField:case OperandType.InlineMethod:case OperandType.InlineSig:case OperandType.InlineTok:case OperandType.InlineType:value=Token(r,MetadataTokens.EntityHandle(br.ReadInt32()));break;
                  case OperandType.InlineSwitch:int n=br.ReadInt32();var targets=new int[n];for(int i=0;i<n;i++)targets[i]=br.ReadInt32();value=string.Join(",",targets);break;
                  default:throw new InvalidDataException("Unhandled operand "+code.OperandType);
                }
                lines.Add(offset.ToString("X4")+" "+code.Name+" "+value);
              }
              var locals=b.LocalSignature.IsNil?"":string.Join(",",r.GetStandaloneSignature(b.LocalSignature).DecodeLocalSignature(new Names(),(object?)null));
              lines.Add("locals:"+locals+";init:"+b.LocalVariablesInitialized+";maxstack:"+b.MaxStack);
              foreach(var e in b.ExceptionRegions)lines.Add("EH:"+e.Kind+":"+e.TryOffset+":"+e.TryLength+":"+e.HandlerOffset+":"+e.HandlerLength+":"+(e.Kind==ExceptionRegionKind.Catch?Token(r,e.CatchType):e.Kind==ExceptionRegionKind.Filter?e.FilterOffset.ToString():""));
              return string.Join("\n",lines);
            }
            static object Inspect(string path)
            {
              byte[] bytes=File.ReadAllBytes(path);using var pe=new PEReader(new MemoryStream(bytes));
              if(!pe.HasMetadata)throw new InvalidDataException("Not managed: "+path);var r=pe.GetMetadataReader();var a=r.GetAssemblyDefinition();
              var methods=new SortedDictionary<string,object>();var types=new SortedDictionary<string,object>();
              foreach(var th in r.TypeDefinitions)
              {
                var t=r.GetTypeDefinition(th);var fields=new SortedDictionary<string,string>();
                foreach(var fh in t.GetFields())
                {
                  var f=r.GetFieldDefinition(fh);var c=f.GetDefaultValue();fields[r.GetString(f.Name)]=f.DecodeSignature(new Names(),(object?)null)+":"+f.Attributes+(c.IsNil?"":":"+Convert.ToHexString(r.GetBlobBytes(r.GetConstant(c).Value)));
                }
                types[TypeName(r,th)]=new{Base=Token(r,t.BaseType),Attributes=t.Attributes.ToString(),Fields=fields};
                foreach(var mh in t.GetMethods())
                {
                  var m=r.GetMethodDefinition(mh);string? normalized=null,raw=null;
                  if(m.RelativeVirtualAddress!=0){var b=pe.GetMethodBody(m.RelativeVirtualAddress);normalized=NormalizedBody(r,b);raw=Hash(b.GetILBytes()??Array.Empty<byte>());}
                  methods[Token(r,mh)]=new{Attributes=m.Attributes.ToString(),Implementation=m.ImplAttributes.ToString(),IL=normalized,RawIlSha256=raw,NormalizedIlSha256=normalized==null?null:Hash(Encoding.UTF8.GetBytes(normalized))};
                }
              }
              return new{File=Path.GetFileName(path),Length=bytes.Length,Sha256=Hash(bytes),Assembly=r.GetString(a.Name),Version=a.Version.ToString(),MetadataVersion=r.MetadataVersion,Mvid=r.GetGuid(r.GetModuleDefinition().Mvid),Machine=pe.PEHeaders.CoffHeader.Machine.ToString(),CorFlags=pe.PEHeaders.CorHeader?.Flags.ToString(),References=r.AssemblyReferences.Select(h=>{var x=r.GetAssemblyReference(h);return new{Name=r.GetString(x.Name),Version=x.Version.ToString()};}).ToArray(),Types=types,Methods=methods};
            }
            static void Main(string[] args)
            {
              if(args.Length<2)throw new ArgumentException("Output and assembly paths required");
              File.WriteAllText(args[0],JsonSerializer.Serialize(args.Skip(1).Select(Inspect).ToArray(),new JsonSerializerOptions{WriteIndented=true}));
              Console.WriteLine("Statically inspected "+(args.Length-1)+" assemblies. No mod code loaded or executed.");
            }
            sealed class Names:ISignatureTypeProvider<string,object?>
            {
              public string GetArrayType(string e,ArrayShape s)=>e+"["+s.Rank+":"+string.Join(",",s.Sizes)+":"+string.Join(",",s.LowerBounds)+"]";
              public string GetByReferenceType(string e)=>e+"&";
              public string GetFunctionPointerType(MethodSignature<string> s)=>"fn "+Sig(s);
              public string GetGenericInstantiation(string g,System.Collections.Immutable.ImmutableArray<string> a)=>g+"<"+string.Join(",",a)+">";
              public string GetGenericMethodParameter(object? c,int i)=>"!!"+i;
              public string GetGenericTypeParameter(object? c,int i)=>"!"+i;
              public string GetModifiedType(string m,string u,bool q)=>(q?"modreq ":"modopt ")+m+" "+u;
              public string GetPinnedType(string e)=>e+" pinned";
              public string GetPointerType(string e)=>e+"*";
              public string GetPrimitiveType(PrimitiveTypeCode c)=>c.ToString();
              public string GetSZArrayType(string e)=>e+"[]";
              public string GetTypeFromDefinition(MetadataReader r,TypeDefinitionHandle h,byte k)=>Token(r,h);
              public string GetTypeFromReference(MetadataReader r,TypeReferenceHandle h,byte k)=>Token(r,h);
              public string GetTypeFromSpecification(MetadataReader r,object? c,TypeSpecificationHandle h,byte k)=>r.GetTypeSpecification(h).DecodeSignature(this,c);
            }
          }
          ''',encoding='utf-8')
      - name: Inspect both old DLLs and the newly combined DLL without executing mod code
        run: dotnet run --project build/dll-inspector/Inspector.csproj -c Release -- build/binary-comparison/dll-inspection.json build/binary-comparison/main-f8a37b9.dll build/binary-comparison/repair-ea4c546.dll prebuilt/Bloodlines.dll
      - name: Recheck preservation and publish merge to repair branch only
        run: python tools/ci/integrate_harbor.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-integration-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/*integration.log
            build/harbor-merge.log
            build/harbor-preservation.json
            build/binary-comparison/*
            build/*-sources.zip
            build/dll-inspector/Program.cs
            build/dll-inspector/Inspector.csproj
            docs/HARBOR-INTEGRATION*
            docs/HARBOR-REPAIR-VERIFICATION.md
            src/Bloodlines/**/*.cs
            tests/story/*.cs
            prebuilt/Bloodlines.dll
