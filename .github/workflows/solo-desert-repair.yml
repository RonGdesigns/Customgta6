name: solo-desert-repair
on:
  push:
    branches: [codex/solo-desert-playtest-repairs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-desert-repair
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/solo-desert-playtest-repairs'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Snapshot exact committed source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          git archive -o build/solo-desert-source.zip HEAD
      - name: Build and behavioral checks
        shell: pwsh
        run: |
          dotnet build src/Bloodlines/Bloodlines.csproj -c Release --warnaserror *> build/repair-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-build.log -Tail 70; exit 1 }
          python tools/run_story_tests.py *> build/repair-story.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-story.log -Tail 70; exit 1 }
          python tools/run_regression_tests.py *> build/repair-regression.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-regression.log -Tail 70; exit 1 }
          python tools/test_dialogue_parser.py *> build/repair-parser.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-parser.log -Tail 40; exit 1 }
          python tools/lint_missions.py *> build/repair-lint.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-lint.log -Tail 60; exit 1 }
          python tools/validate_locations.py *> build/repair-locations.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-locations.log -Tail 60; exit 1 }
          python tools/build_story.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/audit_campaign.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content build/repair-story.log -Tail 5
          Get-Content build/repair-regression.log -Tail 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solo-desert-repair-evidence
          retention-days: 14
          path: |
            build/solo-desert-source.zip
            build/repair-*.log
