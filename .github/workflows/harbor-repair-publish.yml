# Temporary verified publisher, scoped to Ron's authorized comparison branch.
name: harbor-repair-publish
on:
  push:
    branches: [codex/harbor-playtest-repair]
    paths: ['tools/ci/apply-harbor-repair.py']
permissions:
  contents: read
concurrency:
  group: harbor-repair-publish
  cancel-in-progress: true
jobs:
  verify-and-publish:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/harbor-playtest-repair'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply checksum-verified source delta
        run: python tools/ci/apply-harbor-repair.py
      - name: Compile production
        run: dotnet build src/Bloodlines/Bloodlines.csproj -c Release --warnaserror
      - name: Behavioral suites
        shell: pwsh
        run: |
          python tools/run_story_tests.py *> build/story-harbor.log
          $result=$LASTEXITCODE
          Get-Content build/story-harbor.log -Tail 50
          if ($result -ne 0) { exit $result }
          python tools/run_regression_tests.py *> build/regression-harbor.log
          $result=$LASTEXITCODE
          Get-Content build/regression-harbor.log -Tail 8
          if ($result -ne 0) { exit $result }
      - name: Data and source checks
        shell: pwsh
        run: |
          python tools/test_dialogue_parser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/lint_missions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_locations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_story.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_campaign.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild and stage matching binary
        shell: pwsh
        run: |
          python tools/build_roslyn.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item src/Bloodlines/bin/Release/Bloodlines.dll prebuilt/Bloodlines.dll -Force
          python tools/package.py --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified files, not an untested patch
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path
          branch='codex/harbor-playtest-repair'
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert remote==os.environ['EXPECTED_HEAD'], 'Branch advanced; refusing to overwrite newer work'
          files=json.loads(p('build/harbor-changed.json').read_text())
          binary=p('prebuilt/Bloodlines.dll').read_bytes()
          assert binary==p('build/deploy/scripts/Bloodlines.dll').read_bytes(), 'Packaged DLL mismatch'
          report=p('docs/HARBOR-REPAIR-VERIFICATION.md')
          report.write_text('# Harbor repair source verification\n\nBase: `d295306764fa137ceda3e1f3741e2a0d766bdb45`.\n\nVerified input: `'+os.environ['EXPECTED_HEAD']+'`; Actions run: `'+os.environ['GITHUB_RUN_ID']+'`.\n\nProduction warnings-as-errors build, parser tests, mission lint, locations, story freshness, mission-map freshness, Roslyn rebuild and clean packaging passed.\n\n## Story suite\n```text\n'+'\n'.join(p('build/story-harbor.log').read_text(errors='replace').splitlines()[-6:])+'\n```\n\n## Regression suite\n```text\n'+'\n'.join(p('build/regression-harbor.log').read_text(errors='replace').splitlines()[-3:])+'\n```\n\nDLL SHA-256: `'+hashlib.sha256(binary).hexdigest()+'`.\n\nNo GTA runtime was available: these are source/stub checks, not proof of reachable sea geometry, police behavior, score audibility or apartment rendering. Read HARBOR-PLAYTEST-REPAIR.md for the live acceptance route. The old phase-resume preview is superseded: this revision restarts the whole heist.\n',encoding='utf-8')
          files+=['prebuilt/Bloodlines.dll',str(report).replace('\\','/')]
          temporary=['tools/ci/apply-harbor-repair.py','.github/workflows/harbor-repair-publish.yml']+['tools/ci/harbor-repair.part'+str(i) for i in range(7)]
          for path in temporary:p(path).unlink()
          files+=temporary
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(set(files)),check=True)
          subprocess.run(['git','-c','core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','fix: validate harbor staging and add one-sitting heist, police sighting and mission presentation'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('Published:',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-repair-implementation-evidence
          retention-days: 14
          path: |
            build/*harbor.log
            build/harbor-changed.json
            build/harbor-source.patch
            src/Bloodlines/**/*.cs
            tests/story/*.cs
            src/Bloodlines/bin/Release/Bloodlines.dll
            docs/HARBOR*.md
