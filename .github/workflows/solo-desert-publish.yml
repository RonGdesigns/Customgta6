# Temporary publisher scoped to Ron's requested comparison branch. Never merges main.
name: solo-desert-publish
on:
  push:
    branches: [codex/solo-desert-playtest-repairs]
    paths: ['tools/ci/solo_desert_apply.py']
permissions:
  contents: read
concurrency:
  group: solo-desert-publish
  cancel-in-progress: true
jobs:
  verify-publish:
    if: github.repository == 'RonGdesigns/Customgta6' && github.ref == 'refs/heads/codex/solo-desert-playtest-repairs'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply checksum-verified source patch
        run: python tools/ci/solo_desert_apply.py
      - name: Production and full behavioral verification
        shell: pwsh
        run: |
          dotnet build src/Bloodlines/Bloodlines.csproj -c Release --warnaserror *> build/repair-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-build.log -Tail 80; exit 1 }
          python tools/run_story_tests.py *> build/repair-story.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-story.log -Tail 85; exit 1 }
          python tools/run_regression_tests.py *> build/repair-regression.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-regression.log -Tail 60; exit 1 }
          python tools/test_dialogue_parser.py *> build/repair-parser.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-parser.log; exit 1 }
          python tools/lint_missions.py *> build/repair-lint.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-lint.log -Tail 60; exit 1 }
          python tools/validate_locations.py *> build/repair-locations.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-locations.log -Tail 60; exit 1 }
          python tools/build_story.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/audit_campaign.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/render_campaign_doc.py
          python tools/render_feasibility_doc.py
          git diff --exit-code docs/FEASIBILITY.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content build/repair-story.log -Tail 5
          Get-Content build/repair-regression.log -Tail 3
      - name: Rebuild and package the actual repaired source
        shell: pwsh
        run: |
          python tools/build_roslyn.py *> build/repair-roslyn.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-roslyn.log -Tail 80; exit 1 }
          Copy-Item src/Bloodlines/bin/Release/Bloodlines.dll prebuilt/Bloodlines.dll -Force
          python tools/package.py --clean *> build/repair-package.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/repair-package.log -Tail 60; exit 1 }
      - name: Publish only tested files on the repair branch
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import hashlib, json, os, pathlib, subprocess
          p = pathlib.Path
          branch = 'codex/solo-desert-playtest-repairs'
          assert subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0] == os.environ['EXPECTED_HEAD'], 'Branch advanced; do not overwrite it.'
          binary = p('prebuilt/Bloodlines.dll').read_bytes()
          assert binary == p('build/deploy/scripts/Bloodlines.dll').read_bytes(), 'Package mismatch'
          assert not list(p('build/deploy').rglob('savegame.json'))
          assert not list(p('build/deploy').rglob('Bloodlines.Surveyed.ini'))
          assert not p('build/deploy/scripts/Bloodlines/Bloodlines.ini').exists()
          report = p('docs/SOLO-DESERT-VERIFICATION.md')
          text = '# Solo/desert repair - automated verification\n\nBaseline: `de923e018203b76c55e1b0b475528e6b06aff3b6`.\n\n'
          text += 'Verified input: `' + os.environ['EXPECTED_HEAD'] + '`; Actions run `' + os.environ['GITHUB_RUN_ID'] + '`.\n\n'
          for log in ['story','regression','parser','lint','locations']:
              text += '## ' + log + '\n```text\n' + '\n'.join(p('build/repair-'+log+'.log').read_text(errors='replace').splitlines()[-5:]) + '\n```\n\n'
          text += 'Production warnings-as-errors compilation, generated scene/map freshness, Roslyn build and clean packaging passed.\n\nDLL SHA-256: `' + hashlib.sha256(binary).hexdigest() + '`.\n\nNo live GTA run or fresh CodeWalker archive query was performed. See SOLO-DESERT-PLAYTEST-REPAIRS.md for placement evidence, limits and the acceptance route.\n'
          report.write_text(text,encoding='utf-8')
          paths = json.loads(p('build/repair-paths.json').read_text())
          paths += ['prebuilt/Bloodlines.dll', str(report)]
          paths += ['tools/ci/solo_desert_payload.'+str(i) for i in range(7)]
          paths += ['tools/ci/solo_desert_apply.py']
          for name in paths:
              if name.startswith('tools/ci/solo_desert_'): p(name).unlink(missing_ok=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(set(paths)),check=True)
          subprocess.run(['git','-c','core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','fix: repair solo freight, nonlethal guards, ammo restock and desert extraction placements'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('Published:',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solo-desert-publisher-evidence
          retention-days: 14
          path: |
            build/repair-*.log
            build/repair-*.json
            src/Bloodlines/**/*.cs
            tests/story/*.cs
            docs/SOLO-DESERT*.md
