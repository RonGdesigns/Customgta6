; Los Santos: Bloodlines - main configuration
; Copy the whole Bloodlines/ folder into  <GTA V>/scripts/  (see docs/INSTALL.md).
; Key names are System.Windows.Forms.Keys values: D1, D2, NumPad1, F10, Q, Back...
; Punctuation may be written literally: [  ]  \  ;  '  ,  .  /  -  =  `
; and a bare digit means the number row, so "1" is D1.

[Keys]
; Defaults follow the implementation toolkit's [Keybinds] block. NumPad also keeps
; the switch clear of 1/2/3, which the game already binds to weapon slots.
SwitchIce = NumPad1
SwitchGohan = NumPad2
SwitchGuess = NumPad3
; No numpad? These two need no numpad and no controller: step through the crew
; in roster order. They work alongside the direct binds above, not instead.
SwitchNext = ]
SwitchPrev = [
; Route the game's own character-select controls to the crew, so a controller
; switches with nothing bound: they are already on the character wheel.
; Michael/Franklin/Trevor pick Ice/Gohan/Guess, and holding the wheel while
; tapping the d-pad left/right steps through the crew.
ControllerSwitch = True
; Take the vanilla wheel over while the crew is deployed. Off, the wheel still
; swaps you to Michael/Franklin/Trevor, which strands the crew mid-mission.
SuppressVanillaSwitch = True
Ability = Capital
MissionStart = J
DeployCrew = F10
; Hold for ~1s to abort a running mission, or to stand the crew down.
AbortMission = Back
DevCapture = F11
DevMenu = F8
SurveyTeleport = F7

[Crew]
; The brothers you are not controlling cannot be hurt; the one you play can.
; Their AI still takes cover and fights. Off, they take damage and can go down.
CompanionsInvincible = True
; With the shield off, companions are topped back up once they fall below this.
; 0 turns the floor off entirely; companions can then die.
CompanionHealthFloor = 150
RespawnOnDeath = True
; Meters a companion may fall behind before it is repositioned on the active
; character (the toolkit's companion leash).
CompanionLeashDistance = 180

[Death]
; What happens when the character you are playing goes down or gets busted.
;
; GTA's own death-and-restart machine is written around Michael, Franklin and
; Trevor. Hand it one of the brothers -- a ped installed with CHANGE_PLAYER_PED
; -- and it fades the screen out, finds no story character to restart into, and
; never fades back in. That is the black screen that looks like a crash.
;
; So the mod handles it instead, for as long as the crew is deployed, and hands
; death straight back to the game the moment you stand down. Off is here to
; isolate a clash with another mod, not because off is playable.
Enabled = True
; Checkpoint restore is used only by missions that explicitly support rebuilding
; world state. Current missions fail on death and can be retried from the start.
; Recovery regroups at the actual pre-deployment player position.
RestoreCheckpoint = False
; The beat: fade to black, hold, fade back in. Milliseconds.
FadeOutMs = 800
HoldMs = 1500
FadeInMs = 1200

[Abilities]
Enabled = True
; Seconds of continuous use from a full meter.
DurationSeconds = 8
; Fraction of the meter regained per second when not in use.
RechargePerSecond = 0.25

[Dev]
; Turns on the on-screen coordinate readout, the capture key, and the bible's
; QA harness: Page Up / Page Down warp mission stages, [ commits a
; checkpoint and Delete restores it. (Switching and abilities are on the
; gameplay binds above.)
Enabled = False
VerboseLogging = False

[VehicleDamage]
; Deeper crumple and softer collision and engine damage, scaled per vehicle class
; on the model's shared handling (cars take the full multiplier, SUVs and vans
; about 80%, trucks about 70%). This is a gameplay change, not a visual one:
; crashes hurt less, and a badly bent car can pull to one side.
Enabled = True
DeformationMultiplier = 2.0
CollisionDamageMultiplier = 0.90
EngineDamageMultiplier = 0.80
; Damage scale on the vehicle a brother is actually sitting in, per vehicle, removed
; when they get out. 0.55 means the car takes 55% of normal damage.
CrewProtectionMultiplier = 0.55

[Visuals]
; Time-of-day grading, shadows, draw distance, blur and water, all through the
; game's own registers. Everything here is put back on stand-down and on reload.
; Costs: the grade and the blur keys are free; ShadowDistanceScale, HeadlightShadows
; and LODBoost are real GPU and streaming work. Turn those off first if the game
; stutters at speed. See docs/VISUALS.md.
Enabled = True
; Apply the daytime grade (10:00-17:00) that cuts the gray haze. Dusk and night grades stay on.
DeSmog = True
; Strength of the grade (0.20 = subtle, 0.35 = balanced, 0.50 = deep)
ContrastStrength = 0.35
; Vehicle headlights cast dynamic shadows at night (GPU cost)
HeadlightShadows = True
; Shadow cascade distance scale, 1.0 = vanilla (GPU cost)
ShadowDistanceScale = 1.50
; Grading preset for the daytime modifier: NaturalCinematic, SunnyCoast, or ModernCrisp
Preset = NaturalCinematic
; Timecycle modifier overrides, one per time band. Empty uses the preset's default.
; A name the game does not know applies nothing; verify names as docs/VISUALS.md describes.
DayModifier =
DawnModifier =
DuskModifier =
NightModifier =
; Level-of-detail range: scene override per frame plus vehicle and ped multipliers,
; capped at 2.0. Streaming cost at 2x speeds; lower it before anything else stutters.
LODBoost = True
LODScale = 1.75
; Camera motion blur and distance blur off
RemoveBlur = True
; Maximum water reflection distance on you and the car you are in
WaterReflections = True
; Deeper ocean swell in free roam only; missions and the prologue keep the authored water
OceanSwell = True




; Installed GTA score events only: no music files are distributed. Set False to disable.
[Audio]
MissionScoreEnabled = True
MissionScoreEvent = DHP1_START
MissionScoreStopEvent = DHP1_STOP
