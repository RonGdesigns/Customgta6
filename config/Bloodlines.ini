; Los Santos: Bloodlines - main configuration
; Copy the whole Bloodlines/ folder into  <GTA V>/scripts/  (see docs/INSTALL.md).
; Key names are System.Windows.Forms.Keys values: D1, D2, NumPad1, F10, Q, Back...
; Punctuation may be written literally: [  ]  \  ;  '  ,  .  /  -  =  `
; and a bare digit means the number row, so "1" is D1.

[Keys]
; Defaults follow the implementation toolkit's [Keybinds] block. NumPad also keeps
; the switch clear of 1/2/3, which the game already binds to weapon slots.
SwitchIce = NumPad1
SwitchGohan = NumPad2
SwitchGuess = NumPad3
; No numpad? These two need no numpad and no controller: step through the crew
; in roster order. They work alongside the direct binds above, not instead.
SwitchNext = ]
SwitchPrev = [
; Route the game's own character-select controls to the crew, so a controller
; switches with nothing bound: they are already on the character wheel.
; Michael/Franklin/Trevor pick Ice/Gohan/Guess.
ControllerSwitch = True
Ability = Capital
MissionStart = J
DeployCrew = F10
; Hold for ~1s to abort a running mission, or to stand the crew down.
AbortMission = Back
DevCapture = F11
DevMenu = F8

[Crew]
; Companions are topped back up once they fall below this, rather than being
; made invincible. 0 turns the floor off entirely — companions can then die.
CompanionHealthFloor = 150
RespawnOnDeath = True
; Metres a companion may fall behind before it is repositioned on the active
; character (the toolkit's companion leash).
CompanionLeashDistance = 180

[Abilities]
Enabled = True
; Seconds of continuous use from a full meter.
DurationSeconds = 8
; Fraction of the meter regained per second when not in use.
RechargePerSecond = 0.25

[Dev]
; Turns on the on-screen coordinate readout, the capture key, and the bible's
; QA harness: Page Up / Page Down warp mission stages, Insert commits a
; checkpoint and Delete restores it. (Switching and abilities are on the
; gameplay binds above.)
Enabled = False
VerboseLogging = False
