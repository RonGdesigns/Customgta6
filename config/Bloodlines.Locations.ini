; Bloodlines — your surveyed campaign coordinates.
;
; This file is yours. The installer places it once and never overwrites it, and
; every key in it wins over the mod's own data/locations.tsv. That is exactly why
; it ships EMPTY: a position written here is treated as something you confirmed in
; the game, and it will keep overriding every future correction to that key.
;
; To survey a spot: set [Dev] Enabled = True in Bloodlines.ini, open the dev menu
; (F8) > Survey, drive or teleport to the real place, press the capture key (F11),
; then paste the captured block here under the matching key. Delete a key and the
; mod falls back to its data-file default.
;
; Format:
;
; [Positions]
; M01.CraneNest.X = 976.60
; M01.CraneNest.Y = -3239.50
; M01.CraneNest.Z = 6.00
;
; [Headings]
; M01.CraneNest = 35
;
; Installs made before September 9, 2026 received a copy of this file that
; carried bible-era M01 positions. The mod recognizes those exact values and
; ignores them (see Bloodlines.log for "stale template override"), so nothing
; needs to be edited by hand; anything you captured yourself still applies.

